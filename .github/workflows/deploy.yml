name: Validate and deploy personal site

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    ASTRO_TELEMETRY_DISABLED: "1"

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26.13.0
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile

            - name: Check Astro and TypeScript
              run: |
                  pnpm check
                  pnpm type-check

            - name: Check manifests and site formatting
              run: |
                  pnpm check:manifest
                  pnpm check:package-manifest
                  pnpm exec biome ci src/config/siteConfig.ts src/config/profileConfig.ts src/config/announcementConfig.ts src/data/friends.ts src/plugins/markdown/manifest.json tests/site/personal-site.spec.ts

            - name: Build static site and search index
              run: pnpm build

            - name: Install test browser
              run: pnpm exec playwright install --with-deps chrome

            - name: Test published content and accessibility
              run: |
                  pnpm exec playwright test tests/site/personal-site.spec.ts
                  pnpm exec playwright test tests/site/a11y.spec.ts --grep 'Site a11y scan lock.*(首页|归档|友链|关于|分类索引|标签索引)$'

            - name: Upload Pages artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure GitHub Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
